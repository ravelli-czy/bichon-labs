<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockFlow — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.8.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6fa;--bg2:#fff;--bg3:#f0f1f7;
  --text:#1a1a2e;--text2:#5a5b7a;--text3:#9a9bb8;--border:#e4e5f0;
  --primary:#5b4fff;--primary-light:#ede9ff;--primary-dark:#4035cc;
  --green:#16c98d;--green-light:#e6faf4;--green-dark:#0da070;
  --red:#ff4d6d;--red-light:#fff0f3;--red-dark:#cc0033;
  --amber:#f59e0b;--amber-light:#fffbeb;--amber-dark:#d97706;
  --blue:#3b82f6;--blue-light:#eff6ff;--blue-dark:#2563eb;
  --r:12px;--r-lg:16px;--r-xl:20px;
  --sh:0 2px 12px rgba(91,79,255,.08);--sh-md:0 6px 24px rgba(91,79,255,.13);
  --hero-1:#4c3fff;--hero-2:#7c5cff;--hero-3:#a87aff;
}
body.dark-mode{
  --bg:#14141f;--bg2:#1c1c2b;--bg3:#242438;
  --text:#f0f0f5;--text2:#b8b8cc;--text3:#7d7d99;--border:#34344a;
  --primary-light:#26224a;
  --green-light:#12332a;
  --red-light:#3a1620;
  --amber-light:#3a2c10;
  --blue-light:#122642;
  --sh:0 2px 14px rgba(0,0,0,.4);--sh-md:0 6px 24px rgba(0,0,0,.45);
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden}

/* TOPBAR */
.topbar{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.tb-left{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:var(--primary);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon i{color:#fff;font-size:22px}
.logo-name{font-weight:900;font-size:17px;color:var(--primary);line-height:1}
.logo-sub{font-size:10px;color:var(--text3);font-weight:600}
.tb-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;text-decoration:none}

/* CONTENT */
.content{padding:16px;padding-bottom:32px;display:flex;flex-direction:column;gap:16px}

/* HERO CARD */
.hero{border-radius:var(--r-xl);background:linear-gradient(135deg,var(--hero-1) 0%,var(--hero-2) 60%,var(--hero-3) 100%);padding:22px 20px 18px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(91,79,255,.35)}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.07);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30px;right:20px;width:100px;height:100px;background:rgba(255,255,255,.05);border-radius:50%;pointer-events:none}
.hero-greeting{font-size:13px;font-weight:700;color:rgba(255,255,255,.75);margin-top:32px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.hero-date{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:18px}
.hero-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hero-metric{}
.hero-metric-val{font-size:22px;font-weight:900;color:#fff;line-height:1;margin-bottom:3px}
.hero-metric-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.65)}
.hero-metric-sub{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px}
.hero-metric-sub.up{background:rgba(22,201,141,.25);color:#7fffcd}
.hero-metric-sub.margin{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9)}
.hero-divider{height:1px;background:rgba(255,255,255,.15);margin-bottom:14px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap}
.hero-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.15);font-size:12px;font-weight:700;color:rgba(255,255,255,.9);text-decoration:none;transition:filter .15s,transform .15s}
.hero-chip i{font-size:14px}
/* Colores sólidos y fijos (no dependen del color de marca del tenant) para
   que el semáforo rojo/amarillo/verde siempre se distinga con claridad. */
.hero-chip.red{background:var(--red);color:#fff}
.hero-chip.amber{background:var(--amber);color:#fff}
.hero-chip.green{background:var(--green);color:#fff}
a.hero-chip:hover{filter:brightness(1.1)}
a.hero-chip:active{transform:scale(.96)}

/* Aviso de Alertas de stock — arriba de todo, antes del hero (no en el
   topbar del shell): fondo rojo sólido + pulso para máximo contraste, tanto
   sobre el fondo claro de .content como si en el futuro se moviera. Va como
   hermano de .hero dentro de .content, que ya da el espaciado via flex+gap. */
.stock-alert-banner{
  display:flex;align-items:center;gap:8px;
  background:#ff3b3b;color:#fff;
  border-radius:var(--r-lg);padding:12px 16px;
  font-size:13px;font-weight:800;
  text-decoration:none;
  box-shadow:0 4px 14px rgba(255,59,59,.35);
  width:100%;
}
.stock-alert-banner:hover{filter:brightness(1.08)}
/* Alertas de stock (lista de compra normal) en amarillo oscuro — menos
   urgente que Alertas de insumos de KIT (rojo, base de .stock-alert-banner
   arriba), que sí bloquea ventas de KITs en curso si no se repone a tiempo. */
#stock-alert-banner{background:#d97706;box-shadow:0 4px 14px rgba(217,119,6,.35)}
.stock-alert-banner .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;animation:sabPulse 1.4s ease-in-out infinite}
.stock-alert-banner span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-alert-banner i:last-child{font-size:13px;flex-shrink:0;margin-left:auto}
@keyframes sabPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* PERIOD TOGGLE — controls both the hero totals AND the sparkline below */
.hero-period-toggle{position:absolute;top:14px;right:14px;display:flex;gap:4px;z-index:2;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px)}
.period-btn{padding:5px 10px;border-radius:20px;border:none;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.18);color:rgba(255,255,255,.75);white-space:nowrap}
.period-btn.active{background:rgba(255,255,255,.92);color:var(--primary)}
.period-btn:hover:not(.active){background:rgba(255,255,255,.28)}
@media(max-width:340px){
  .hero-period-toggle .period-btn{padding:4px 7px;font-size:9.5px}
}

/* MINI BARS (sparkline) */
.sparkline-wrap{margin-top:10px}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:40px}
.spark-bar{flex:1;border-radius:3px 3px 0 0;background:rgba(255,255,255,.25);min-height:4px;transition:height .35s ease}
.spark-bar.today{background:rgba(255,255,255,.9)}
.sparkline-labels{display:flex;gap:3px;margin-top:4px}
.spark-lbl{flex:1;text-align:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden}
.spark-lbl.today{color:rgba(255,255,255,.9);font-weight:900}

/* SECTION LABEL */
.section-label{font-size:13px;font-weight:800;color:var(--text2);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.section-label i{font-size:16px}

/* MODULE CARDS */
.modules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.module-card{background:var(--bg2);border-radius:var(--r-lg);padding:16px;text-decoration:none;color:var(--text);box-shadow:var(--sh);border:1.5px solid var(--border);display:flex;flex-direction:column;gap:0;transition:all .2s;position:relative;overflow:hidden}
.module-card:active{transform:scale(.97)}
.module-card:hover{border-color:var(--primary);box-shadow:var(--sh-md)}
.mc-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.mc-icon i{font-size:22px}
.mc-name{font-size:14px;font-weight:900;margin-bottom:4px}
.mc-desc{font-size:11px;color:var(--text3);font-weight:600;line-height:1.4}
.mc-badge{position:absolute;top:10px;right:10px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:900}
.mc-badge.new{background:var(--primary-light);color:var(--primary)}
.mc-badge.alert{background:var(--red-light);color:var(--red)}
.mc-badge.ok{background:var(--green-light);color:var(--green-dark)}
.mc-stat{margin-top:8px;font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:4px;border-top:1px solid var(--border);padding-top:8px}
.mc-stat i{font-size:13px}

/* RECENT ORDERS */
.order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);border-radius:8px;transition:background .15s}
.order-row:last-child{border-bottom:none;padding-bottom:0}
.order-row:hover{background:var(--bg3);margin:0 -8px;padding-left:8px;padding-right:8px}
.order-avatar{width:38px;height:38px;border-radius:11px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--primary);flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-items{font-size:11px;color:var(--text3);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-right{text-align:right;flex-shrink:0}
.order-total{font-size:14px;font-weight:900;color:var(--green-dark)}
.order-date{font-size:10px;color:var(--text3);font-weight:600;margin-top:1px}

/* CARD */
.card{background:var(--bg2);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:7px}
.card-link{font-size:12px;font-weight:800;color:var(--primary);text-decoration:none}

/* FOOTER */
.footer{text-align:center;font-size:11px;color:var(--text3);font-weight:700;padding:8px 16px 24px}

/* EMBED MODE (inside iframe in index.html) */
body.embedded .topbar{display:none}
body.embedded .content{padding-top:8px}
body.embedded #modules-section,body.embedded .footer{display:none}

/* Embedded in the desktop Home iframe: the iframe itself already sits in
   the app's full-width content area, so don't re-cap it — just keep a
   normal content gutter instead of centering in a narrow column. */
@media(min-width:768px){
  body.embedded{max-width:100%}
  body.embedded .content{padding-left:32px;padding-right:32px}
}

/* ═══════════════════════════════════════════════
   RESPONSIVE — Desktop ≥ 768 px
═══════════════════════════════════════════════ */
@media(min-width:768px){
  body{max-width:900px}
  .content{gap:20px}

  /* Hero: wider metrics */
  .hero{padding:28px 28px 22px}
  .hero-metric-val{font-size:28px}
  /* Plenty of horizontal room here for the top-right period toggle to sit
     beside the greeting without overlapping it — undo the mobile clearance. */
  .hero-greeting{margin-top:0}

  /* Modules: 3 cols */
  .modules-grid{grid-template-columns:repeat(3,1fr)}

  /* Recent orders: wider card */
  .order-row{gap:14px}
}

@media(min-width:1100px){
  body{max-width:1100px}

  /* Hero: 4-chip row spreads nicely */
  .hero-chips{gap:12px}

  /* Modules: 4 cols */
  .modules-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="logo-icon"><i class="ti ti-packages"></i></div>
    <div>
      <div class="logo-name">StockFlow</div>
      <div class="logo-sub">OMS · WMS</div>
    </div>
  </div>
  <div class="tb-right">
    <a href="/" target="_top" class="icon-btn" title="Ir a la app"><i class="ti ti-layout-dashboard"></i></a>
    <a href="onboarding.html" target="_top" class="icon-btn" title="Configuración"><i class="ti ti-settings"></i></a>
  </div>
</div>

<div class="content">

  <a href="#" id="stock-alert-banner" class="stock-alert-banner" style="display:none">
    <span class="dot"></span>
    <i class="ti ti-alert-triangle"></i>
    <span id="stock-alert-banner-text">Nueva lista de compra pendiente</span>
    <i class="ti ti-chevron-right"></i>
  </a>

  <a href="#" id="kit-shortage-banner" class="stock-alert-banner" style="display:none">
    <span class="dot"></span>
    <i class="ti ti-stack-2"></i>
    <span id="kit-shortage-banner-text">Nueva lista de insumos por venta de KITs pendiente</span>
    <i class="ti ti-chevron-right"></i>

  <!-- HERO -->
  <div class="hero" id="hero-card">
    <div class="hero-period-toggle" id="hero-range-toggle">
      <button class="period-btn" data-range="today" onclick="setHeroRange('today')">Hoy</button>
      <button class="period-btn" data-range="week" onclick="setHeroRange('week')">Última Semana</button>
      <button class="period-btn active" data-range="month" onclick="setHeroRange('month')">Mes Actual</button>
      <button class="period-btn" data-range="full" onclick="setHeroRange('full')">Full</button>
    </div>
    <div class="hero-greeting"><i class="ti ti-wave-sine"></i> <span id="greeting">Buenos días</span></div>
    <div class="hero-date" id="hero-date">—</div>
    <div class="hero-metrics">
      <div class="hero-metric">
        <div class="hero-metric-val" id="hero-ventas">$0</div>
        <div class="hero-metric-lbl" id="hero-ventas-lbl">Ventas del mes</div>
        <div class="hero-metric-sub up" id="hero-ventas-var" style="display:none"><i class="ti ti-trending-up" style="font-size:11px"></i> —</div>
      </div>
      <div class="hero-metric">
        <div class="hero-metric-val" id="hero-util">$0</div>
        <div class="hero-metric-lbl">Utilidad bruta</div>
        <div class="hero-metric-sub margin" id="hero-margin">—% margen</div>
      </div>
    </div>
    <div class="sparkline-wrap">
      <div class="sparkline" id="sparkline"></div>
      <div class="sparkline-labels" id="spark-labels"></div>
    </div>
    <div class="hero-divider" style="margin-top:12px"></div>
    <div class="hero-chips" style="justify-content:space-between">
      <div id="pedidos-huincha" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <button onclick="viewSalesKPIs()" style="position:relative;z-index:2;display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:none;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.92);color:var(--primary);white-space:nowrap">
        Ver más <i class="ti ti-arrow-right" style="font-size:13px"></i>
      </button>
    </div>
  </div>

  <!-- MESÓN CREATIVO — visible in both embedded (Home tab) and standalone dashboard -->
  <a href="javascript:void(0)" onclick="navTo('meson')" class="card" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);cursor:pointer">
    <div style="width:44px;height:44px;border-radius:13px;background:#fffbeb;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <i class="ti ti-hammer" style="font-size:22px;color:#d97706"></i>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:900">🔨 Mesón Creativo</div>
      <div style="font-size:11.5px;color:var(--text3);font-weight:600;margin-top:2px">Arma un nuevo KIT arrastrando SKUs existentes</div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--text3);font-size:18px"></i>
  </a>

  <!-- ÚLTIMAS VENTAS -->
  <div id="recent-orders-section"></div>

  <!-- MÓDULOS -->
  <div id="modules-section">
    <div class="section-label"><i class="ti ti-apps" style="color:var(--primary)"></i>Acceso a módulos</div>
    <div class="modules-grid" id="modules-grid"></div>
  </div>

</div>

<div class="footer">StockFlow v1.0 · Neon PostgreSQL + Vercel Functions</div>

<script>
// Embed mode: loaded inside index.html iframe
const IS_EMBED = new URLSearchParams(location.search).has('embed');
if (IS_EMBED) document.body.classList.add('embedded');

// Navigate the TOP-level window, never the iframe itself — a plain
// `location.href = ...` here would navigate this iframe in place, loading
// the full app recursively inside the small dashboard iframe (visible as a
// duplicated header/sidebar). window.top is reliable regardless of whether
// IS_EMBED was detected correctly, so every "leave the dashboard" navigation
// goes through this instead of touching `location` directly.
function _navigateTop(url) {
  (window.top !== window.self ? window.top : window).location.href = url;
}

// Dark mode — same-origin, shares localStorage with the parent app/index.html
(function applyDarkMode(){
  try {
    const key = 'sf_prefs_' + (localStorage.getItem('sf_tenant_id') || 'default');
    const prefs = JSON.parse(localStorage.getItem(key) || '{}');
    document.body.classList.toggle('dark-mode', !!prefs.darkMode);
  } catch (e) {}
})();

// Tenant brand colors — same-origin, shares localStorage with index.html
function shadeColor(hex, pct) {
  try {
    const n = parseInt(hex.replace('#',''), 16);
    let r = (n>>16) & 0xff, g = (n>>8) & 0xff, b = n & 0xff;
    if (pct < 0) { const f = 1 + pct/100; r*=f; g*=f; b*=f; }
    else { r += (255-r)*pct/100; g += (255-g)*pct/100; b += (255-b)*pct/100; }
    r = Math.min(255,Math.max(0,Math.round(r)));
    g = Math.min(255,Math.max(0,Math.round(g)));
    b = Math.min(255,Math.max(0,Math.round(b)));
    return `#${((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}`;
  } catch { return hex; }
}
(function applyTenantColors(){
  const color  = localStorage.getItem('sf_tenant_color');
  const color2 = localStorage.getItem('sf_tenant_color2');
  if (color) {
    document.documentElement.style.setProperty('--primary', color);
    document.documentElement.style.setProperty('--primary-dark', shadeColor(color, -20));
    document.documentElement.style.setProperty('--primary-light', shadeColor(color, 85));
  }
  if (color2) {
    document.documentElement.style.setProperty('--green', color2);
    document.documentElement.style.setProperty('--green-dark', shadeColor(color2, -20));
    document.documentElement.style.setProperty('--green-light', shadeColor(color2, 85));
  }
  // Third color: only used for the hero card's gradient here in the Home
  // dashboard — nowhere else in the app. Derives a darker→base→lighter
  // 3-stop gradient from it so the degradé look is preserved either way.
  const color3 = localStorage.getItem('sf_tenant_color3');
  if (color3) {
    document.documentElement.style.setProperty('--hero-1', shadeColor(color3, -15));
    document.documentElement.style.setProperty('--hero-2', color3);
    document.documentElement.style.setProperty('--hero-3', shadeColor(color3, 35));
  }
})();

const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

// Navigate to an app section — postMessage to parent when embedded, direct href otherwise
const PAGE_URLS_DASH = { inventory:'/inventory', ventas:'/orders', locales:'/locales', delivery:'/delivery-hub', meson:'/meson-creativo' };
function navTo(page) {
  if (IS_EMBED && window.parent !== window) {
    window.parent.postMessage({ type: 'sf_navigate', page }, '*');
  } else {
    _navigateTop(PAGE_URLS_DASH[page] || '/' + page);
  }
}
// Huincha de pedidos: cada chip lleva a Ventas ya filtrada por ese bucket de fecha
function goToVentasFiltered(bucket) {
  if (IS_EMBED && window.parent !== window) {
    window.parent.postMessage({ type: 'sf_navigate', page: 'ventas', ventasDateFilter: bucket }, '*');
  } else {
    _navigateTop('/orders?due=' + bucket);
  }
}
// Últimas ventas: cada fila lleva al detalle de esa orden
function goToOrder(id) {
  if (IS_EMBED && window.parent !== window) {
    window.parent.postMessage({ type: 'sf_navigate', page: 'ventas', orderId: id }, '*');
  } else {
    _navigateTop('/orders/' + encodeURIComponent(id));
  }
}
function newVentaFromDash() {
  if (IS_EMBED && window.parent !== window) {
    window.parent.postMessage({ type: 'sf_create_order', payload: {} }, '*');
  } else {
    _navigateTop('/orders');
  }
}
function viewSalesKPIs() {
  if (IS_EMBED && window.parent !== window) {
    window.parent.postMessage({ type: 'sf_navigate', page: 'reportes' }, '*');
  } else {
    _navigateTop('/reportes');
  }
}

// Data is loaded from the API — see init() at bottom of script
let PRODUCTS = [], VENTAS = [], KITS_LIST = [];
let totalVentas = 0, utilidad = 0, margen = 0, varPct = 0, allTimeVentas = 0;
let critical = [], warning = [], alertas = [];

// ── GREETING + DATE (no API dependency) ────────
(function(){
  const now = new Date();
  const h = now.getHours();
  const greet = h<12?'Buenos días 👋':h<19?'Buenas tardes 👋':'Buenas noches 👋';
  document.getElementById('greeting').textContent = greet;
  document.getElementById('hero-date').textContent = now.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
})();

// renderHero, renderOrders, renderModules
// called by init() once API data arrives
function renderHero() {
  document.getElementById('hero-ventas').textContent    = fmt(totalVentas);
  document.getElementById('hero-util').textContent      = fmt(utilidad);
  document.getElementById('hero-margin').textContent    = margen + '% margen';
  const varEl = document.getElementById('hero-ventas-var');
  if (heroRange !== 'full' && varPct !== 0) {
    const prevLabel = heroRange === 'today' ? 'ayer' : heroRange === 'week' ? 'sem. ant.' : 'mes ant.';
    varEl.style.display = '';
    varEl.innerHTML = `<i class="ti ti-trending-${varPct>0?'up':'down'}" style="font-size:11px"></i> ${varPct>0?'+':''}${varPct}% vs ${prevLabel}`;
    varEl.className = 'hero-metric-sub ' + (varPct > 0 ? 'up' : 'down');
  } else {
    varEl.style.display = 'none';
  }
}

// Aviso de Alertas de stock (ver /stock-alerts) — vive acá, dentro del hero
// morado, en vez del topbar del shell: acá tiene el contraste fuerte que
// necesita para llamar la atención de verdad, y es lo primero que se ve al
// entrar al Home. `pending` es la corrida 'pendiente' más reciente (o null).
function renderStockAlertBanner(pending) {
  const el = document.getElementById('stock-alert-banner');
  if (!pending) { el.style.display = 'none'; return; }
  el.style.display = '';
  document.getElementById('stock-alert-banner-text').textContent =
    `Nueva lista de compra pendiente — ${pending.item_count} producto${pending.item_count !== 1 ? 's' : ''}`;
  el.onclick = (e) => { e.preventDefault(); _navigateTop('/stock-alerts?id=' + encodeURIComponent(pending.id)); };
}

// Mismo criterio que renderStockAlertBanner, para la corrida 'pendiente' de
// Alertas de insumos de KIT ("Comprar x Venta" en /stock-alerts). `pending`
// es la corrida más reciente (o null) de GET ?resource=kit-shortage-alerts&scope=pending.
function renderKitShortageBanner(pending) {
  const el = document.getElementById('kit-shortage-banner');
  if (!pending) { el.style.display = 'none'; return; }
  el.style.display = '';
  document.getElementById('kit-shortage-banner-text').textContent =
    `Insumos por comprar (venta de KITs) — ${pending.item_count} insumo${pending.item_count !== 1 ? 's' : ''}`;
  el.onclick = (e) => { e.preventDefault(); _navigateTop('/stock-alerts?tab=kits&id=' + encodeURIComponent(pending.id)); };
}

// ── HUINCHA DE PEDIDOS POR HACER — semáforo por fecha de entrega ──────
// Reemplaza la antigua línea "x productos, y KITs, z órdenes, p alertas".
const PEDIDOS_HUINCHA_DONE_STATUSES = ['entregada', 'no_entregada', 'cancelled'];
function _localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function renderPedidosHuincha() {
  const now = new Date();
  const todayStr = _localDateStr(now);
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = _localDateStr(tomorrow);

  const pendientes = VENTAS.filter(v => !PEDIDOS_HUINCHA_DONE_STATUSES.includes(v.status));
  let hoy = 0, manana = 0, resto = 0;
  pendientes.forEach(v => {
    const d = v.delivery && v.delivery.date;
    if (d === todayStr) hoy++;
    else if (d === tomorrowStr) manana++;
    else resto++;
  });

  document.getElementById('pedidos-huincha').innerHTML = `
    <a href="javascript:void(0)" onclick="goToVentasFiltered('hoy')" class="hero-chip red"><i class="ti ti-alert-circle"></i> ${hoy} para hoy</a>
    <a href="javascript:void(0)" onclick="goToVentasFiltered('manana')" class="hero-chip amber"><i class="ti ti-clock"></i> ${manana} para mañana</a>
    <a href="javascript:void(0)" onclick="goToVentasFiltered('resto')" class="hero-chip green"><i class="ti ti-calendar"></i> ${resto} resto</a>`;
}

// ── HERO TOTALS RANGE (Full / Mes Actual / Última Semana) ─────────────
let heroRange = 'month'; // 'today' | 'week' | 'month' | 'full'
const HERO_RANGE_LABELS = { today: 'Ventas de hoy', week: 'Ventas última semana', month: 'Ventas del mes', full: 'Ventas totales' };

function _orderDateObj(v) {
  if (v.created_at) { const d = new Date(v.created_at); if (!isNaN(d)) return d; }
  if (v.fecha) {
    const parts = v.fecha.split('-').map(Number);
    if (parts.length === 3) { const d = new Date(parts[2], parts[1]-1, parts[0]); if (!isNaN(d)) return d; }
  }
  return null;
}
function _ordersInRange(orders, start, end) {
  return orders.filter(v => {
    const d = _orderDateObj(v);
    if (!d) return false;
    if (start && d < start) return false;
    if (end && d >= end) return false;
    return true;
  });
}
function _sumVentasCosto(orders) {
  const total = orders.reduce((s,v) => s + (v.total||0), 0);
  const costo = orders.reduce((s,v) => {
    if (!Array.isArray(v.items)) return s;
    return s + v.items.reduce((is, item) => {
      // Prefer the cost snapshotted on the item at time of sale (or by the
      // cost backfill for older orders) over today's product cost.
      if (item.cost != null) return is + (item.cost || 0) * item.qty;
      if (item.type === 'kit') {
        const kit = KITS_LIST.find(k => k.sku === item.sku);
        if (!kit || !Array.isArray(kit.items)) return is;
        return is + kit.items.reduce((ks, comp) => {
          const p = PRODUCTS.find(x => x.sku === comp.sku);
          return ks + (p ? p.cost * comp.qty : 0);
        }, 0) * item.qty;
      }
      const p = PRODUCTS.find(x => x.sku === item.sku);
      return is + (p ? p.cost * item.qty : 0);
    }, 0);
  }, 0);
  return { total, costo };
}
// Recomputes totalVentas/utilidad/margen/varPct for the currently selected
// heroRange, comparing against the equivalent previous period (previous
// calendar month for "month", the prior 7 days for "week"; "full" has no
// meaningful previous period, so its comparison badge stays hidden).
function computeHeroStats() {
  const now = new Date();
  let current, previous;
  if (heroRange === 'today') {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const prevStart = new Date(start); prevStart.setDate(start.getDate() - 1);
    current  = _ordersInRange(VENTAS, start, null);
    previous = _ordersInRange(VENTAS, prevStart, start);
  } else if (heroRange === 'week') {
    const start = new Date(now); start.setHours(0,0,0,0); start.setDate(start.getDate() - 6);
    const prevStart = new Date(start); prevStart.setDate(start.getDate() - 7);
    current  = _ordersInRange(VENTAS, start, null);
    previous = _ordersInRange(VENTAS, prevStart, start);
  } else if (heroRange === 'month') {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    current  = _ordersInRange(VENTAS, start, null);
    previous = _ordersInRange(VENTAS, prevStart, start);
  } else {
    current  = VENTAS;
    previous = null;
  }
  const { total: curTotal, costo: curCosto } = _sumVentasCosto(current);
  totalVentas = curTotal;
  utilidad    = curTotal - curCosto;
  margen      = curTotal > 0 ? Math.round(utilidad / curTotal * 100) : 0;
  if (previous) {
    const { total: prevTotal } = _sumVentasCosto(previous);
    varPct = prevTotal > 0 ? Math.round((curTotal - prevTotal) / prevTotal * 100) : (curTotal > 0 ? 100 : 0);
  } else {
    varPct = 0;
  }
  const lblEl = document.getElementById('hero-ventas-lbl');
  if (lblEl) lblEl.textContent = HERO_RANGE_LABELS[heroRange];
}
function setHeroRange(range) {
  heroRange = range;
  document.querySelectorAll('#hero-range-toggle .period-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  computeHeroStats();
  renderHero();
  renderSparkline(range);
}

// ── SPARKLINE — driven by the same range as the hero totals ───────────
// Bucketing depends on how wide the selected range is: hourly for "hoy",
// daily for "última semana", weekly for "mes actual", monthly for "full".
const DOW_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function computeSparklineBuckets(range) {
  const now = new Date();
  if (range === 'today') {
    const bucketHours = 4, nBuckets = 24 / bucketHours;
    const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const values = new Array(nBuckets).fill(0);
    const labels = Array.from({length:nBuckets}, (_,i) => String(i*bucketHours).padStart(2,'0') + 'h');
    VENTAS.forEach(v => {
      const d = _orderDateObj(v);
      if (!d || d < dayStart) return;
      const idx = Math.min(nBuckets-1, Math.floor((d - dayStart) / 3600000 / bucketHours));
      values[idx] += (v.total||0);
    });
    return { values, labels, todayIndex: Math.min(nBuckets-1, Math.floor(now.getHours() / bucketHours)) };
  }
  if (range === 'week') {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()); start.setDate(start.getDate() - 6);
    const values = new Array(7).fill(0);
    const labels = Array.from({length:7}, (_,i) => {
      const d = new Date(start); d.setDate(start.getDate()+i);
      return i === 6 ? 'Hoy' : DOW_SHORT[d.getDay()];
    });
    VENTAS.forEach(v => {
      const d = _orderDateObj(v);
      if (!d || d < start) return;
      const idx = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - start) / 86400000);
      if (idx >= 0 && idx < 7) values[idx] += (v.total||0);
    });
    return { values, labels, todayIndex: 6 };
  }
  if (range === 'month') {
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 1);
    const nBuckets = Math.ceil(Math.round((monthEnd - monthStart) / 86400000) / 7);
    const values = new Array(nBuckets).fill(0);
    const labels = Array.from({length:nBuckets}, (_,i) => `Sem ${i+1}`);
    VENTAS.forEach(v => {
      const d = _orderDateObj(v);
      if (!d || d < monthStart || d >= monthEnd) return;
      const dayOfMonth = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - monthStart) / 86400000);
      values[Math.min(nBuckets-1, Math.floor(dayOfMonth / 7))] += (v.total||0);
    });
    const todayDayOfMonth = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - monthStart) / 86400000);
    return { values, labels, todayIndex: Math.min(nBuckets-1, Math.floor(todayDayOfMonth / 7)) };
  }
  // 'full' — trailing 12 months
  const nBuckets = 12;
  const bucketStart = new Date(now.getFullYear(), now.getMonth() - (nBuckets-1), 1);
  const values = new Array(nBuckets).fill(0);
  const labels = Array.from({length:nBuckets}, (_,i) => MONTHS_SHORT[(bucketStart.getMonth()+i) % 12]);
  VENTAS.forEach(v => {
    const d = _orderDateObj(v);
    if (!d) return;
    const idx = (d.getFullYear() - bucketStart.getFullYear())*12 + (d.getMonth() - bucketStart.getMonth());
    if (idx >= 0 && idx < nBuckets) values[idx] += (v.total||0);
  });
  return { values, labels, todayIndex: nBuckets-1 };
}
function renderSparkline(range) {
  const { values, labels, todayIndex } = computeSparklineBuckets(range);
  const max = Math.max(1, ...values);
  document.getElementById('sparkline').innerHTML = values.map((v,i) => {
    const pct = Math.max(Math.round(v / max * 100), 5);
    return `<div class="spark-bar${i===todayIndex?' today':''}" style="height:${pct}%" title="${labels[i]}: ${fmt(v)}"></div>`;
  }).join('');
  document.getElementById('spark-labels').innerHTML = labels.map((l,i) =>
    `<span class="spark-lbl${i===todayIndex?' today':''}">${l}</span>`
  ).join('');
}

function renderOrders() {
  if (!VENTAS.length) { document.getElementById('recent-orders-section').innerHTML = ''; return; }
  const rows = VENTAS.slice(0,5).map(v => {
    const initials = (v.cliente||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const itemsStr = Array.isArray(v.items) ? v.items.map(i=>`${i.name||i.sku} ×${i.qty}`).join(' · ') : (v.items||'');
    return `<div class="order-row" onclick="goToOrder('${v.id}')" style="cursor:pointer">
      <div class="order-avatar">${initials}</div>
      <div class="order-info"><div class="order-name">${v.cliente||'Cliente'}</div><div class="order-items">${itemsStr}</div></div>
      <div class="order-right"><div class="order-total">${fmt(v.total||0)}</div><div class="order-date">${v.fecha||''}</div></div>
    </div>`;
  }).join('');
  document.getElementById('recent-orders-section').innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="ti ti-shopping-bag" style="color:var(--green-dark)"></i>Últimas ventas</div><div style="display:flex;align-items:center;gap:10px"><button onclick="newVentaFromDash()" style="background:var(--red,#ef4444);color:#fff;font-size:12px;font-weight:800;padding:6px 13px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;gap:5px"><i class="ti ti-shopping-bag" style="font-size:13px"></i>Nueva venta</button><a href="javascript:void(0)" onclick="navTo('ventas')" class="card-link">Ver todas →</a></div></div>
      ${rows}
    </div>`;
}

function renderModules() {
  const modules = [
    { href:'onboarding.html', icon:'ti-rocket', iconBg:'#ede9ff', iconColor:'#5b4fff', name:'Onboarding', desc:'Configuración inicial del negocio', badge:{text:'Empezar aquí',cls:'new'}, stat:null },
    { page:'inventory', icon:'ti-box', iconBg:'#e6faf4', iconColor:'#0da070', name:'Inventario', desc:'Productos, KITs, stock y movimientos',
      badge: alertas.length ? {text:alertas.length+' alertas',cls:'alert'} : {text:PRODUCTS.length+' ítems',cls:'ok'},
      stat:`<i class="ti ti-packages"></i>${PRODUCTS.length} productos · ${KITS_LIST.length} KITs` },
    { page:'meson', icon:'ti-hammer', iconBg:'#fffbeb', iconColor:'#d97706', name:'Mesón Creativo', desc:'Arma un nuevo KIT arrastrando SKUs', badge:{text:'Nuevo',cls:'new'}, stat:`<i class="ti ti-drag-drop"></i>Drag &amp; drop` },
    { page:'ventas', icon:'ti-shopping-bag', iconBg:'#ede9ff', iconColor:'#5b4fff', name:'Ventas', desc:'Órdenes, delivery y seguimiento',
      badge: VENTAS.length ? {text:VENTAS.length+' órdenes',cls:'ok'} : null,
      stat:`<i class="ti ti-coin"></i>${fmt(allTimeVentas)} total` },
    { page:'locales', icon:'ti-building-store', iconBg:'#f0fdfa', iconColor:'#0d9488', name:'Locales', desc:'Tiendas, almacenes y formas de envío', badge:null, stat:`<i class="ti ti-map-pin"></i>Locales configurados` },
    { page:'delivery', icon:'ti-truck-delivery', iconBg:'#fffbeb', iconColor:'#d97706', name:'Delivery', desc:'Envíos, couriers y tracking', badge:null, stat:`<i class="ti ti-route"></i>Rutas y repartidores` },
    { href:'routes.html', icon:'ti-route', iconBg:'#eff6ff', iconColor:'#2563eb', name:'Rutas', desc:'Armar rutas, mapa y optimizador', badge:null, stat:`<i class="ti ti-map"></i>Drag &amp; drop` },
    { href:'driver.html', icon:'ti-steering-wheel', iconBg:'#fff0f3', iconColor:'#ff4d6d', name:'Repartidor', desc:'Ejecutar entregas, GPS y fotos', badge:null, stat:`<i class="ti ti-device-mobile"></i>App móvil` },
    { href:'/docs', icon:'ti-api', iconBg:'#f0fdf4', iconColor:'#16a34a', name:'API & Docs', desc:'Integra tu sistema vía REST API', badge:{text:'API v1',cls:'new'}, stat:`<i class="ti ti-key"></i>OMS · WMS · SHM · IAM` },
  ];
  document.getElementById('modules-grid').innerHTML = modules.map(m => `
    <a href="${m.page ? 'javascript:void(0)' : m.href}" ${m.page ? `onclick="navTo('${m.page}')"` : ''} class="module-card">
      ${m.badge?`<div class="mc-badge ${m.badge.cls}">${m.badge.text}</div>`:''}
      <div class="mc-icon" style="background:${m.iconBg}"><i class="ti ${m.icon}" style="color:${m.iconColor}"></i></div>
      <div class="mc-name">${m.name}</div><div class="mc-desc">${m.desc}</div>
      ${m.stat?`<div class="mc-stat">${m.stat}</div>`:''}
    </a>`).join('');
}

// ── AUTH GUARD ────────────────────────────────
(function(){
  const token = (window.top !== window.self ? window.top : window).localStorage ? localStorage.getItem('sf_token') : null;
  if (!token) {
    const target = window.top !== window.self ? window.top : window;
    target.location.replace('/login');
  }
})();

// ── ASYNC INIT: load from API, then render all ─
(async function init() {
  const token    = localStorage.getItem('sf_token');
  const tenantId = localStorage.getItem('sf_tenant_id');
  const authHeaders = {};
  if (token)    authHeaders['Authorization'] = 'Bearer ' + token;
  if (tenantId) authHeaders['X-Tenant-Id']   = tenantId;
  let stockAlertPending = null;
  let kitShortagePending = null;
  try {
    const [products, kits, orders, pending, kitPending] = await Promise.all([
      fetch('/api/products', { headers: authHeaders }).then(r => r.ok ? r.json() : []),
      fetch('/api/kits', { headers: authHeaders }).then(r => r.ok ? r.json() : []),
      fetch('/api/orders', { headers: authHeaders }).then(r => r.ok ? r.json() : []),
      fetch('/api/orders?resource=stock-alerts&scope=pending', { headers: authHeaders }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/orders?resource=kit-shortage-alerts&scope=pending', { headers: authHeaders }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    PRODUCTS  = Array.isArray(products) ? products : [];
    KITS_LIST = Array.isArray(kits)     ? kits     : [];
    VENTAS    = Array.isArray(orders)   ? orders   : [];
    stockAlertPending  = pending;
    kitShortagePending = kitPending;
  } catch(e) {
    console.warn('[Dashboard] API unavailable:', e.message);
  }
  renderStockAlertBanner(stockAlertPending);
  renderKitShortageBanner(kitShortagePending);

  // Compute derived values
  allTimeVentas = _sumVentasCosto(VENTAS).total; // used by the "Ventas" module card stat, unaffected by the hero range toggle
  computeHeroStats();
  critical   = PRODUCTS.filter(p => p.stock === 0);
  warning    = PRODUCTS.filter(p => p.stock > 0 && p.stock <= p.threshold);
  alertas    = [...critical, ...warning];

  // Render all sections
  renderHero();
  renderPedidosHuincha();
  renderSparkline(heroRange);
  renderOrders();
  renderModules();
})();
</script>
